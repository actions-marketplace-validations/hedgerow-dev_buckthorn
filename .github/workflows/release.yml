name: Release

# Runs only when a GitHub release is published, so it uses no minutes until
# then. Same trigger as Hayward: a stray tag push does not publish anything.
# See RELEASING.md for the steps. "Run workflow" (workflow_dispatch) builds and
# tests on every platform without publishing, to try a release before making it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The tag comes in through the environment, never spliced into the script.
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
      - run: pip install build==1.6.1
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Runs the test suite against the exact wheel the build job made: on Linux
  # with the oldest and newest supported Pythons, and once on Windows and
  # macOS. Those two run only here, once per release, since they bill at 2x
  # and 10x. Plain `pytest` does not put the checkout on sys.path, so the
  # tests import the installed wheel.
  test:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install the built wheel
        run: |
          wheel=$(ls dist/*.whl)
          pip install "${wheel}[dev]"
      # A hung test prints every thread's traceback after 60 s, and the step
      # stops itself, so the log is kept (a cancelled job's log can be lost).
      - run: pytest -o faulthandler_timeout=60
        timeout-minutes: 10
      - run: buckthorn --version

  publish:
    if: github.event_name == 'release'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/buckthorn
    permissions:
      id-token: write # Trusted Publishing (OIDC). No API token exists.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Uploads PEP 740 attestations by default under Trusted Publishing.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
