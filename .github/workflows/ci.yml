name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run for the same ref instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux only: the private repo pays for minutes, and macOS bills at 10x.
    # The oldest and newest supported Pythons.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
      - if: matrix.python-version == '3.13'
        run: ruff check .
